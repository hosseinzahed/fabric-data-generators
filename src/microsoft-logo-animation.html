<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Logo Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .logo-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            perspective: 1000px;
        }

        .microsoft-logo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            width: 100%;
            height: 100%;
            transition: all 0.3s ease;
        }

        .logo-piece {
            width: 100%;
            height: 100%;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-origin: center;
        }

        .piece-1 {
            background-color: #f25022;
        }

        .piece-2 {
            background-color: #7fba00;
        }

        .piece-3 {
            background-color: #00a4ef;
        }

        .piece-4 {
            background-color: #ffb900;
        }

        /* Split animation states */
        .split .piece-1 {
            transform: translate(-150px, -150px) rotate(360deg) scale(0.8);
            opacity: 0.7;
        }

        .split .piece-2 {
            transform: translate(150px, -150px) rotate(-360deg) scale(0.8);
            opacity: 0.7;
        }

        .split .piece-3 {
            transform: translate(-150px, 150px) rotate(-360deg) scale(0.8);
            opacity: 0.7;
        }

        .split .piece-4 {
            transform: translate(150px, 150px) rotate(360deg) scale(0.8);
            opacity: 0.7;
        }

        /* Reunify animation - smooth transition back */
        .reunify .logo-piece {
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            transform: translate(0, 0) rotate(0deg) scale(1);
            opacity: 1;
        }

        /* Enhanced reunify with staggered timing for each piece */
        .reunify .piece-1 {
            transition-delay: 0s;
            animation: reunifyBounce 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .reunify .piece-2 {
            transition-delay: 0.02s;
            animation: reunifyBounce 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.02s;
        }

        .reunify .piece-3 {
            transition-delay: 0.04s;
            animation: reunifyBounce 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.04s;
        }

        .reunify .piece-4 {
            transition-delay: 0.06s;
            animation: reunifyBounce 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.06s;
        }

        @keyframes reunifyBounce {
            0% {
                transform: var(--split-transform);
                opacity: 0.7;
            }
            30% {
                transform: translate(0, 0) rotate(0deg) scale(0.9);
                opacity: 0.8;
            }
            60% {
                transform: translate(0, 0) rotate(0deg) scale(1.1);
                opacity: 0.95;
            }
            80% {
                transform: translate(0, 0) rotate(0deg) scale(0.95);
                opacity: 1;
            }
            100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
        }

        .animate-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .animate-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #764ba2, #667eea);
        }

        .animate-button:active {
            transform: translateY(0);
        }

        .animate-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .title {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: 300;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            font-size: 1.2em;
            font-weight: 300;
        }

        .motion-log {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 280px;
            max-height: 200px;
            padding: 16px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            color: #f1f1f1;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
            font-size: 13px;
            line-height: 1.4;
            display: none;
            z-index: 1200;
        }

        .motion-log.active {
            display: block;
        }

        .motion-log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 12px;
        }

        .motion-log-content {
            max-height: 140px;
            overflow-y: auto;
            scrollbar-width: thin;
        }

        .motion-log-content::-webkit-scrollbar {
            width: 6px;
        }

        .motion-log-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 3px;
        }

        .motion-log-entry {
            margin-bottom: 6px;
            opacity: 0.9;
        }

        .motion-log-controls {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
            gap: 8px;
        }

        .motion-log-button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #f1f1f1;
            font-size: 11px;
            padding: 4px 10px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .motion-log-button:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Particle effect for extra visual appeal */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        .particle.animate {
            animation: particleFloat 0.5s ease-out;
        }

        @keyframes particleFloat {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--random-x), var(--random-y)) scale(0);
            }
        }

        /* Shake hint animation */
        @keyframes fadeInOut {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            20% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            80% {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
            100% {
                opacity: 0;
                transform: translateX(-50%) translateY(-20px);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .logo-container {
                width: 150px;
                height: 150px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .animate-button {
                padding: 12px 24px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Microsoft Logo Animation</h1>
        <p class="subtitle">Click the button to see the magic happen!</p>
        
        <div class="logo-container">
            <div class="microsoft-logo" id="microsoftLogo">
                <div class="logo-piece piece-1"></div>
                <div class="logo-piece piece-2"></div>
                <div class="logo-piece piece-3"></div>
                <div class="logo-piece piece-4"></div>
            </div>
        </div>
        
        <button class="animate-button" id="animateBtn" onclick="animateLogo('button')">
            Go!
        </button>
    </div>

        <div class="motion-log" id="motionLog" aria-live="polite" aria-label="Motion sensor log">
            <div class="motion-log-header">
                <span>Motion Logs</span>
                <span id="motionLogStatus">waiting…</span>
            </div>
            <div class="motion-log-content" id="motionLogContent"></div>
            <div class="motion-log-controls">
                <button class="motion-log-button" id="motionLogToggle">Hide</button>
                <button class="motion-log-button" id="motionLogClear">Clear</button>
            </div>
        </div>

    <script>
        let isAnimating = false;

        const motionLog = document.getElementById('motionLog');
        const motionLogContent = document.getElementById('motionLogContent');
        const motionLogStatus = document.getElementById('motionLogStatus');
        const motionLogToggle = document.getElementById('motionLogToggle');
        const motionLogClear = document.getElementById('motionLogClear');
    const logEntries = [];
    let motionSampleCount = 0;
        const LOG_LIMIT = 30;

        function logStatus(message, { highlight = false } = {}) {
            const timestamp = new Date().toLocaleTimeString();
            const entry = document.createElement('div');
            entry.className = 'motion-log-entry';
            entry.textContent = `[${timestamp}] ${message}`;
            if (highlight) {
                entry.style.color = '#ffd166';
            }

            logEntries.push(entry);
            while (logEntries.length > LOG_LIMIT) {
                const removed = logEntries.shift();
                if (removed.parentNode) {
                    removed.parentNode.removeChild(removed);
                }
            }

            motionLogContent.appendChild(entry);
            motionLogContent.scrollTop = motionLogContent.scrollHeight;

            if (!motionLog.classList.contains('active')) {
                motionLog.classList.add('active');
                motionLogToggle.textContent = 'Hide';
            }

            motionLogStatus.textContent = highlight ? 'event' : 'listening…';
        }

        motionLogToggle.addEventListener('click', () => {
            const isActive = motionLog.classList.toggle('active');
            motionLogToggle.textContent = isActive ? 'Hide' : 'Show';
        });

        motionLogClear.addEventListener('click', () => {
            motionLogContent.innerHTML = '';
            logEntries.length = 0;
            motionLogStatus.textContent = 'cleared';
        });

        if (!window.isSecureContext) {
            logStatus('⚠️ Motion sensors require a secure origin (https or localhost). file:// pages are blocked in Chrome.', { highlight: true });
        } else {
            logStatus('Motion logger ready. Waiting for sensor events.');
        }

        function animateLogo(source = 'manual') {
            if (isAnimating) {
                logStatus(`Animation request via ${source} ignored (already running).`);
                return;
            }

            isAnimating = true;
            const logo = document.getElementById('microsoftLogo');
            const button = document.getElementById('animateBtn');
            const pieces = document.querySelectorAll('.logo-piece');

            logStatus(`Animation triggered via ${source}.`, { highlight: source === 'shake' });

            button.disabled = true;
            button.textContent = 'Wait...';

            pieces[0].style.setProperty('--split-transform', 'translate(-150px, -150px) rotate(360deg) scale(0.8)');
            pieces[1].style.setProperty('--split-transform', 'translate(150px, -150px) rotate(-360deg) scale(0.8)');
            pieces[2].style.setProperty('--split-transform', 'translate(-150px, 150px) rotate(-360deg) scale(0.8)');
            pieces[3].style.setProperty('--split-transform', 'translate(150px, 150px) rotate(360deg) scale(0.8)');

            createParticles();
            logo.classList.add('split');

            setTimeout(() => {
                button.textContent = 'Wait...';
                logo.classList.remove('split');
                logo.classList.add('reunify');

                setTimeout(() => createParticles(), 100);

                setTimeout(() => {
                    logo.classList.remove('reunify');
                    isAnimating = false;
                    button.disabled = false;
                    button.textContent = 'Go!';
                    logStatus('Animation complete.');
                }, 560);
            }, 500);
        }

        function createParticles() {
            const container = document.querySelector('.logo-container');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random position around the logo
                const x = Math.random() * 200;
                const y = Math.random() * 200;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                // Random movement direction
                const randomX = (Math.random() - 0.5) * 300 + 'px';
                const randomY = (Math.random() - 0.5) * 300 + 'px';
                particle.style.setProperty('--random-x', randomX);
                particle.style.setProperty('--random-y', randomY);
                
                container.appendChild(particle);
                
                // Trigger animation
                requestAnimationFrame(() => {
                    particle.classList.add('animate');
                });
                
                // Remove particle after animation
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }, 2000);
            }
        }

        // Add keyboard support
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space' || event.code === 'Enter') {
                event.preventDefault();
                animateLogo('keyboard');
            }
        });

        // Easter egg: Double click for random color change
        let clickCount = 0;
        document.getElementById('microsoftLogo').addEventListener('click', function() {
            clickCount++;
            if (clickCount === 2) {
                changeColors();
                clickCount = 0;
            }
            setTimeout(() => clickCount = 0, 500);
        });

        function changeColors() {
            const pieces = document.querySelectorAll('.logo-piece');
            const colors = ['#f25022', '#7fba00', '#00a4ef', '#ffb900'];
            
            pieces.forEach((piece, index) => {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.backgroundColor = randomColor;
            });
            
            // Reset colors after 3 seconds
            setTimeout(() => {
                pieces[0].style.backgroundColor = '#f25022';
                pieces[1].style.backgroundColor = '#7fba00';
                pieces[2].style.backgroundColor = '#00a4ef';
                pieces[3].style.backgroundColor = '#ffb900';
            }, 3000);
        }

        // Shake detection for mobile devices
        let shakeDetectionEnabled = false;
    let lastAcceleration = { x: null, y: null, z: null };
    let lastAccelerationMagnitude = null;
    let lastShakeTime = 0;
    let deviceMotionListenerAdded = false;
    let deviceMotionEventTriggered = false;
    const SHAKE_THRESHOLD = 15; // Sensitivity threshold (default)
    const ANDROID_THRESHOLD = 9; // Lower threshold for Chrome on Android
    const SHAKE_TIMEOUT = 1000; // Minimum time between shake detections

        function detectShake(event) {
            if (!shakeDetectionEnabled || isAnimating) return;

            const acceleration = event.accelerationIncludingGravity || event.acceleration;
            if (!acceleration) return;

            deviceMotionEventTriggered = true;
            motionSampleCount += 1;
            if (motionSampleCount <= 3) {
                logStatus(`Motion sample #${motionSampleCount}: x=${(acceleration.x ?? 0).toFixed(2)}, y=${(acceleration.y ?? 0).toFixed(2)}, z=${(acceleration.z ?? 0).toFixed(2)}`);
            }

            const currentTime = Date.now();
            if (currentTime - lastShakeTime < SHAKE_TIMEOUT) return;

            const x = acceleration.x ?? 0;
            const y = acceleration.y ?? 0;
            const z = acceleration.z ?? 0;

            let deltaVector = 0;
            if (lastAcceleration.x !== null && lastAcceleration.y !== null && lastAcceleration.z !== null) {
                const dx = x - lastAcceleration.x;
                const dy = y - lastAcceleration.y;
                const dz = z - lastAcceleration.z;
                deltaVector = Math.sqrt(dx * dx + dy * dy + dz * dz);
            }

            const magnitude = Math.sqrt(x * x + y * y + z * z);
            const magnitudeDelta = lastAccelerationMagnitude === null ? 0 : Math.abs(magnitude - lastAccelerationMagnitude);

            const threshold = /Chrome.*Android/i.test(navigator.userAgent) ? ANDROID_THRESHOLD : SHAKE_THRESHOLD;
            const combinedDelta = Math.max(deltaVector, magnitudeDelta);

            logStatus(`Δ=${combinedDelta.toFixed(2)} (vec=${deltaVector.toFixed(2)}, mag=${magnitudeDelta.toFixed(2)}) threshold=${threshold}`);

            if (combinedDelta > threshold) {
                lastShakeTime = currentTime;
                logStatus('Shake detected! Triggering animation.', { highlight: true });
                animateLogo('shake');

                if (navigator.vibrate) {
                    navigator.vibrate(100);
                }
            }

            lastAcceleration = { x, y, z };
            lastAccelerationMagnitude = magnitude;
        }

        // Request permission and enable shake detection on mobile devices
        function enableShakeDetection() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            if (!isMobile) {
                logStatus('Shake detection skipped: not a mobile device.');
                return;
            }

            if (deviceMotionListenerAdded) {
                logStatus('Shake detection already enabled.');
                return;
            }

            logStatus('Attempting to enable shake detection...');

            if (!window.isSecureContext) {
                logStatus('Chrome blocks motion sensors when opened via file://. Please serve this page via https:// or localhost for full access.', { highlight: true });
            }

            const attachListener = () => {
                if (deviceMotionListenerAdded) return;

                window.addEventListener('devicemotion', detectShake, { passive: true });
                deviceMotionListenerAdded = true;
                shakeDetectionEnabled = true;

                // Show hint after the first actual event fires
                const notifyOnMotion = () => {
                    deviceMotionEventTriggered = true;
                    logStatus('Device motion event received. Shake detection active!', { highlight: true });
                    showShakeHint();
                    window.removeEventListener('devicemotion', notifyOnMotion);
                };
                window.addEventListener('devicemotion', notifyOnMotion, { once: true, passive: true });

                // Fallback warning if no events arrive (likely due to permissions or insecure origin)
                setTimeout(() => {
                    if (!deviceMotionEventTriggered) {
                        logStatus('No device motion events detected yet. If you are opening the file directly, try using `chrome://flags/#sensor` (enable) or run a local server.', { highlight: true });
                    }
                }, 2000);
            };

            if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
                DeviceMotionEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            attachListener();
                            logStatus('DeviceMotion permission granted.');
                        } else {
                            logStatus(`DeviceMotion permission state: ${permissionState}.`, { highlight: true });
                        }
                    })
                    .catch(error => {
                        console.error('DeviceMotion permission denied:', error);
                        logStatus('DeviceMotion permission request was denied.', { highlight: true });
                    });
            } else {
                attachListener();
            }
        }

        function showShakeHint() {
            const hint = document.createElement('div');
            hint.innerHTML = '📱 Shake your phone to animate!';
            hint.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: rgba(255, 255, 255, 0.9);
                color: #333;
                padding: 10px 20px;
                border-radius: 20px;
                font-size: 14px;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
                z-index: 1000;
                animation: fadeInOut 4s ease-in-out;
            `;
            
            document.body.appendChild(hint);
            
            // Remove hint after animation
            setTimeout(() => {
                if (hint.parentNode) {
                    hint.parentNode.removeChild(hint);
                }
            }, 4000);
        }

        ['touchstart', 'click'].forEach(eventName => {
            document.addEventListener(eventName, event => {
                logStatus(`User interaction (${event.type}) detected. Attempting sensor access.`);
                enableShakeDetection();
            }, { once: true, passive: true });
        });

        // Enable shake detection when the page loads
        window.addEventListener('load', function() {
            const logo = document.getElementById('microsoftLogo');
            logo.style.animation = 'bounceBack 1s ease-out';
            
            // Enable shake detection after a short delay
            setTimeout(enableShakeDetection, 1000);
        });
    </script>
</body>
</html>
