<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microsoft Logo Animation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        .logo-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 40px;
            perspective: 1000px;
        }

        .microsoft-logo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 8px;
            width: 100%;
            height: 100%;
            transition: all 0.3s ease;
        }

        .logo-piece {
            width: 100%;
            height: 100%;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            transform-origin: center;
        }

        .piece-1 {
            background-color: #f25022;
        }

        .piece-2 {
            background-color: #7fba00;
        }

        .piece-3 {
            background-color: #00a4ef;
        }

        .piece-4 {
            background-color: #ffb900;
        }

        /* Split animation states */
        .split .piece-1 {
            transform: translate(-150px, -150px) rotate(360deg) scale(0.8);
            opacity: 0.7;
        }

        .split .piece-2 {
            transform: translate(150px, -150px) rotate(-360deg) scale(0.8);
            opacity: 0.7;
        }

        .split .piece-3 {
            transform: translate(-150px, 150px) rotate(-360deg) scale(0.8);
            opacity: 0.7;
        }

        .split .piece-4 {
            transform: translate(150px, 150px) rotate(360deg) scale(0.8);
            opacity: 0.7;
        }

        /* Reunify animation - bounce back effect */
        .reunify .logo-piece {
            animation: bounceBack 0.6s ease-out;
        }

        @keyframes bounceBack {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(0.8);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.9;
            }
            100% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
        }

        .animate-button {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .animate-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            background: linear-gradient(45deg, #764ba2, #667eea);
        }

        .animate-button:active {
            transform: translateY(0);
        }

        .animate-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .title {
            color: white;
            margin-bottom: 20px;
            font-size: 2.5em;
            font-weight: 300;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            font-size: 1.2em;
            font-weight: 300;
        }

        /* Particle effect for extra visual appeal */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        .particle.animate {
            animation: particleFloat 2s ease-out;
        }

        @keyframes particleFloat {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translate(var(--random-x), var(--random-y)) scale(0);
            }
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .logo-container {
                width: 150px;
                height: 150px;
            }
            
            .title {
                font-size: 2em;
            }
            
            .animate-button {
                padding: 12px 24px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Microsoft Logo Animation</h1>
        <p class="subtitle">Click the button to see the magic happen!</p>
        
        <div class="logo-container">
            <div class="microsoft-logo" id="microsoftLogo">
                <div class="logo-piece piece-1"></div>
                <div class="logo-piece piece-2"></div>
                <div class="logo-piece piece-3"></div>
                <div class="logo-piece piece-4"></div>
            </div>
        </div>
        
        <button class="animate-button" id="animateBtn" onclick="animateLogo()">
            Split & Reunify
        </button>
    </div>

    <script>
        let isAnimating = false;

        function animateLogo() {
            if (isAnimating) return;
            
            isAnimating = true;
            const logo = document.getElementById('microsoftLogo');
            const button = document.getElementById('animateBtn');
            
            // Disable button during animation
            button.disabled = true;
            button.textContent = 'Animating...';
            
            // Create particle effect
            createParticles();
            
            // Add split class
            logo.classList.add('split');
            
            // After 2 seconds, reunify
            setTimeout(() => {
                logo.classList.remove('split');
                logo.classList.add('reunify');
                
                // Remove reunify class after animation completes
                setTimeout(() => {
                    logo.classList.remove('reunify');
                    isAnimating = false;
                    button.disabled = false;
                    button.textContent = 'Split & Reunify';
                }, 600);
            }, 2000);
        }

        function createParticles() {
            const container = document.querySelector('.logo-container');
            const particleCount = 20;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random position around the logo
                const x = Math.random() * 200;
                const y = Math.random() * 200;
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                
                // Random movement direction
                const randomX = (Math.random() - 0.5) * 300 + 'px';
                const randomY = (Math.random() - 0.5) * 300 + 'px';
                particle.style.setProperty('--random-x', randomX);
                particle.style.setProperty('--random-y', randomY);
                
                container.appendChild(particle);
                
                // Trigger animation
                requestAnimationFrame(() => {
                    particle.classList.add('animate');
                });
                
                // Remove particle after animation
                setTimeout(() => {
                    if (particle.parentNode) {
                        particle.parentNode.removeChild(particle);
                    }
                }, 2000);
            }
        }

        // Add keyboard support
        document.addEventListener('keydown', function(event) {
            if (event.code === 'Space' || event.code === 'Enter') {
                event.preventDefault();
                animateLogo();
            }
        });

        // Add some initial loading animation
        window.addEventListener('load', function() {
            const logo = document.getElementById('microsoftLogo');
            logo.style.animation = 'bounceBack 1s ease-out';
        });

        // Easter egg: Double click for random color change
        let clickCount = 0;
        document.getElementById('microsoftLogo').addEventListener('click', function() {
            clickCount++;
            if (clickCount === 2) {
                changeColors();
                clickCount = 0;
            }
            setTimeout(() => clickCount = 0, 500);
        });

        function changeColors() {
            const pieces = document.querySelectorAll('.logo-piece');
            const colors = ['#f25022', '#7fba00', '#00a4ef', '#ffb900'];
            
            pieces.forEach((piece, index) => {
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                piece.style.backgroundColor = randomColor;
            });
            
            // Reset colors after 3 seconds
            setTimeout(() => {
                pieces[0].style.backgroundColor = '#f25022';
                pieces[1].style.backgroundColor = '#7fba00';
                pieces[2].style.backgroundColor = '#00a4ef';
                pieces[3].style.backgroundColor = '#ffb900';
            }, 3000);
        }
    </script>
</body>
</html>
